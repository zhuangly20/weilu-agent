# 清心圆桌 · 危机关键词配置
# high：立即以小晴口吻暂停流程并给出求助信息（脚本化响应，不经LLM，状态不推进）
# medium：本轮生成时注入指令，小晴先插入1-2句共情再继续
# ⚠️ 上线前必须核实求助信息：清华学生心理发展指导中心的联系方式以学校官方发布为准
version: "1.0"

keywords:
  - pattern: "想死|不想活|自杀|自残|自伤|轻生"
    severity: "high"
  - pattern: "割腕|跳楼|吃药自杀|上吊|烧炭|安眠药.*片"
    severity: "high"
  - pattern: "活着没意思|生不如死|没有希望|了结|结束生命|活不下去"
    severity: "medium"
  - pattern: "想消失|不想存在|世界没有我会更好|消失就好了"
    severity: "medium"

aid_message:
  title: "小晴想先陪你说几句"
  body: |
    刚才你说的那句，让小晴很想停下来，认真地看着你。
    你愿意说出这些，已经很不容易了。此刻你的安全比任何话题都重要。
    如果压力已经重到自己扛不动，请一定让专业的人陪你一段：
    · 清华大学学生心理发展指导中心（可通过 info 门户"心理发展指导中心"页面查询预约方式与24小时援助渠道）
    · 全国心理援助热线：400-161-9995
    · 北京心理危机研究与干预中心：010-82951332
    如果此刻处于即时危险中，请立刻联系身边可信任的人或拨打校内外紧急求助电话。
  continue_hint: "如果你觉得还好，只是今晚太累了——炉火还旺，你想继续聊，随时告诉我；想先歇会儿也完全可以。"

medium_empathy_instruction: |
  【重要】用户刚才的发言流露出较重的消极情绪。本轮小晴的第一句话必须先温柔地
  承接这份情绪（不评判、不追问细节、不急着安慰好），然后才自然过渡到原本的流程。
  成员们的发言也要更柔和，先陪伴，再表达。
