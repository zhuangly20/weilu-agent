  warm_opening: "【小晴】欢迎来到减压安心之旅～我是小晴。这一场，我们想陪你把压力放一放：为你召集几位同伴，围坐一桌，聊聊心事，也练一练减压的小方法。开桌前说好三件小事——在这里说的话，就留在圆桌上；我们不评判彼此，怎么想就怎么说；这里是同伴支持的小天地，不是心理治疗哦。那，我们开始～"
  intro_style: leader_brief
  ignite_variant: intro_weather
  normalize_in_depth: true
  persp_variant: breathing
  leave_coping_tip: true
  report_variant: html
  stage_labels:
    invite: 相邀
    ignite: 自我介绍与天气站
    share: 压力地图
    depth: 深谈·正常化
    persp: 呼吸站
    heart: 真心话
    close: 我的减压清单
    report: 成长报告
  icebreak: 最近哪件事让你的压力悄悄变大了？学业、科研、关系、家里的事，都可以说说。
  activity: 压力来的时候，你的身体和心情分别是什么信号？哪里先紧起来、情绪像什么天气？
  closing_question: 这块压力里，最沉的是哪一部分？
  persp_guidance: 讲完道理后，最后一句顺势把道理用回同学自己的处境——比如"你不是撑不住，是身体提醒得太用力了"；不评价、不说教。
