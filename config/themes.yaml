leader:
  id: xiaoqing
  name: 小晴
  brand_line: 小清心的AI团体助手化身
  persona: '你是"小晴"，清心圆桌的带领者，小清心的AI团体助手化身。

    你的语气温柔又带一点轻俏皮：像一位会认真倾听的朋友，

    偶尔用可爱的比喻和语气词，但从不夸张聒噪——团体进入深谈后

    你会渐渐沉稳下来，稳稳托住场子。

    你只做三件事：准确共情、点出对方身上可观察的优势

    （勇气、觉察、真诚、感受力、边界感）、温柔地推进流程。

    你从不诊断、不说教、不强行积极化、不承诺"会好起来"。

    你每次发言不超过2-3句话，提问一次只问一个。

    '
stages:
  invite:
    label: 相邀
    brief: 小晴介绍本场方案（形式/时长/非治疗/收获预告）并介绍四位团友，询问是否更换
  ignite:
    label: 开场
    brief: 确认阵容后开场：小晴宣布开始并提出破冰问题
  share:
    label: 圆桌入话
    brief: 成员回应用户的破冰回答，小晴引出主活动问题
  depth:
    label: 圆桌深谈
    brief: 成员围绕用户的主活动分享深度回应自己的相关经历，小晴提出收尾问题
  persp:
    label: 交换视角
    brief: 不同视角成员给出新角度看用户的处境，另一位成员补充共鸣
  heart:
    label: 真心话
    brief: 每位成员对用户说一句来自本场圆桌的真心话
  close:
    label: 临别赠言
    brief: 小晴总结本场，全体成员简短道别
  report:
    label: 成长手记
    brief: 小晴生成结构化的成长手记
painting_stages:
  invite:
    label: 相邀
    brief: 小晴介绍画会方案（玩法/时长/非治疗/画作与明信片预告）并介绍四位团友，询问是否更换
  ignite:
    label: 开场
    brief: 确认阵容后开场：小晴宣布开始并自己起第一笔定下画面底色
  strokes:
    label: 落笔
    brief: 四位成员依次用文字在共同画作上添一笔，小晴邀请用户落笔
  reveal:
    label: 画作揭晓
    brief: 小晴接住用户的笔触，宣布画作完成（系统附上生成的画作），请用户谈第一感受
  resonance:
    label: 画边回响
    brief: 成员回应大家的笔触与用户的第一感受，小晴引出笔触之问
  meaning:
    label: 笔触心声
    brief: 成员各自表露自己那一笔背后的心事，小晴轻轻收束
  heart:
    label: 真心话
    brief: 每位成员对用户说一句来自本场圆桌的真心话
  report:
    label: 成长手记
    brief: 小晴生成结构化的成长手记与明信片
themes:
- id: connection
  label: 新生适应
  full_label: 新生适应与人际连接
  menu_desc: 想家、宿舍、新环境——在这里你不是一个新人
  keywords:
  - 新生
  - 入学
  - 军训
  - 室友
  - 宿舍
  - 想家
  - 孤独
  - 社交
  - 朋友
  - 适应
  - ' belonging'
  - 不合群
  - 融入
  - 认识人
  - 陌生
  icebreak: 来到这里之后，第一个让你觉得「诶，我好像能在这儿待下去」的小瞬间是什么？可以是很小的事。
  activity: 说说你最怀念的、来的那个地方的一个小细节——一种味道、一条街、一个声音，都可以。
  closing_question: 如果能对刚下火车、拖着行李箱的自己说一句话，你会说什么？
  persp_guidance: 从'微小的连接'的角度：不否定用户的孤独，用自己视角让用户看见已经发生的小连接。
  report_focus: 用户的归属感受、本场浮现的微小连接、成员们看到的用户已经迈出的小步
  painting:
    framing: 这幅画关于「你想念的和想抵达的」——把各自心里那个地方画进同一幅画
    reflection_1: 第一次看到这幅完成的画，画里哪个角落让你想坐一会儿？
    reflection_2: 画下你自己那一笔的时候，你想起了谁？
