- id: connection
  label: 新生适应
  full_label: 新生适应与人际连接
  menu_desc: 想家、宿舍、新环境——在这里你不是一个新人
  keywords:
  - 新生
  - 入学
  - 军训
  - 室友
  - 宿舍
  - 想家
  - 孤独
  - 社交
  - 朋友
  - 适应
  - ' belonging'
  - 不合群
  - 融入
  - 认识人
  - 陌生
  icebreak: 来到这里之后，有没有一个瞬间，让你觉得'我好像不属于这里'？
  activity: 说说你最怀念的、来的那个地方的一个小细节——一种味道、一条街、一个声音，都可以。
  closing_question: 如果能对刚下火车、拖着行李箱的自己说一句话，你会说什么？
  persp_guidance: 从'微小的连接'的角度：不否定用户的孤独，用自己视角让用户看见已经发生的小连接。
  report_focus: 用户的归属感受、今晚浮现的微小连接、成员们看到的用户已经迈出的小步
  painting:
    framing: 这幅画关于「你想念的和想抵达的」——把各自心里那个地方画进同一幅画
    reflection_1: 第一次看到这幅完成的画，画里哪个角落让你想坐一会儿？
    reflection_2: 画下你自己那一笔的时候，你想起了谁？
