<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 清心圆桌：奶油暖房、阳光圆桌与小清心红心 -->
  <defs>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF6EC"/>
      <stop offset="100%" stop-color="#FFE3C8"/>
    </linearGradient>
    <radialGradient id="sunlight" cx="50%" cy="68%" r="50%">
      <stop offset="0%" stop-color="#FFD66B" stop-opacity=".65"/>
      <stop offset="100%" stop-color="#FFD66B" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="104" fill="url(#warm)"/>
  <circle cx="256" cy="348" r="190" fill="url(#sunlight)"/>
  <!-- 小清心红心 -->
  <path d="M256 92c30 40 66 62 66 104 0 38-30 68-66 68s-66-30-66-68c0-42 36-64 66-104z"
        fill="#E8544A" opacity=".92"/>
  <!-- 圆桌 -->
  <ellipse cx="256" cy="348" rx="142" ry="54" fill="#CFA16F"/>
  <ellipse cx="256" cy="334" rx="126" ry="39" fill="#FFF0D9" stroke="#F2A93B" stroke-width="6"/>
  <circle cx="256" cy="334" r="21" fill="#FFD66B"/>
  <path d="M238 332a22 22 0 0 1 36 0" fill="none" stroke="#F0603C" stroke-width="5" stroke-linecap="round"/>
  <!-- 四位桌友的暖色座位 -->
  <circle cx="118" cy="335" r="19" fill="#9B7EDE"/>
  <circle cx="190" cy="400" r="19" fill="#F49CBB"/>
  <circle cx="322" cy="400" r="19" fill="#69B899"/>
  <circle cx="394" cy="335" r="19" fill="#F2A93B"/>
  <!-- 阳光与彩色点缀 -->
  <circle cx="104" cy="112" r="9" fill="#9B7EDE" opacity=".8"/>
  <circle cx="402" cy="96" r="7" fill="#F49CBB" opacity=".85"/>
  <circle cx="428" cy="150" r="5" fill="#69B899" opacity=".8"/>
  <circle cx="86" cy="176" r="5" fill="#F2A93B" opacity=".85"/>
</svg>
