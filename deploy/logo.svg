<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 围炉夜话 · 小清心暖色明亮版 logo：奶油底 + 珊瑚橘炉火 + 小清心红心 -->
  <defs>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF6EC"/>
      <stop offset="100%" stop-color="#FFE3C8"/>
    </linearGradient>
    <linearGradient id="fire" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFC46B"/>
      <stop offset="100%" stop-color="#F0603C"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="68%" r="50%">
      <stop offset="0%" stop-color="#FFD66B" stop-opacity=".65"/>
      <stop offset="100%" stop-color="#FFD66B" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="104" fill="url(#warm)"/>
  <circle cx="256" cy="348" r="190" fill="url(#glow)"/>
  <!-- 红心（小清心基因） -->
  <path d="M256 96c30 40 66 62 66 104 0 38-30 68-66 68s-66-30-66-68c0-42 36-64 66-104z"
        transform="translate(0,-6)" fill="#E8544A" opacity=".92"/>
  <!-- 炉火（在心形里燃烧的小火苗） -->
  <path d="M256 190c16 24 38 38 38 64a38 38 0 0 1-76 0c0-26 22-40 38-64z" fill="url(#fire)"/>
  <!-- 柴（暖棕） -->
  <rect x="150" y="332" width="212" height="24" rx="12" fill="#B8815A" transform="rotate(-7 256 344)"/>
  <rect x="150" y="342" width="212" height="24" rx="12" fill="#CE9768" transform="rotate(6 256 354)"/>
  <!-- 四色点缀：小清心紫/粉/金/绿 -->
  <circle cx="104" cy="112" r="9" fill="#9B7EDE" opacity=".8"/>
  <circle cx="402" cy="96" r="7" fill="#F49CBB" opacity=".85"/>
  <circle cx="428" cy="150" r="5" fill="#69B899" opacity=".8"/>
  <circle cx="86" cy="176" r="5" fill="#F2A93B" opacity=".85"/>
</svg>
