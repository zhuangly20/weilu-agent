<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>清小搭上架预览 · 清心圆桌</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;}
  body{background:#eef1f5;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .note{position:fixed;top:10px;left:50%;transform:translateX(-50%);font-size:12px;color:#98a1ad;background:#fff;border:1px solid #e3e8ef;border-radius:20px;padding:4px 14px;box-shadow:0 2px 8px rgba(0,0,0,.05);z-index:9;}
  .phone{width:400px;max-width:100%;height:min(820px,92vh);background:#f5f6f8;border-radius:36px;box-shadow:0 20px 60px rgba(0,0,0,.18);overflow:hidden;display:flex;flex-direction:column;position:relative;border:8px solid #1d2129;}
  .statusbar{height:34px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;color:#333;font-weight:600;}
  .navbar{background:#fff;padding:8px 14px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #f0f1f4;}
  .avatar{width:38px;height:38px;border-radius:10px;object-fit:cover;}
  .nb-name{font-size:16px;font-weight:700;color:#1d2129;}
  .nb-sub{font-size:11.5px;color:#86909c;max-width:250px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .nb-badge{margin-left:auto;font-size:10px;color:#10b981;background:#ecfdf5;border:1px solid #d1fae5;border-radius:10px;padding:2px 8px;}
  .chat{flex:1;overflow-y:auto;padding:14px 14px 8px;display:flex;flex-direction:column;gap:12px;}
  .row{display:flex;gap:8px;max-width:100%;}
  .row.user{justify-content:flex-end;}
  .row .mini-av{width:30px;height:30px;border-radius:8px;object-fit:cover;flex:none;align-self:flex-start;}
  .bubble{padding:10px 13px;border-radius:14px;font-size:14px;line-height:1.65;white-space:pre-wrap;word-break:break-word;}
  .row.ai .bubble{background:#fff;color:#1d2129;border-top-left-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.05);}
  .row.user .bubble{background:#3b82f6;color:#fff;border-top-right-radius:4px;}
  .progress{align-self:center;font-size:11px;color:#86909c;background:#eef1f5;border-radius:12px;padding:3px 12px;}
  .attach{margin-top:6px;display:flex;align-items:center;gap:8px;background:#f7f8fa;border:1px solid #e8ebf0;border-radius:10px;padding:8px 10px;font-size:12.5px;color:#4b5563;cursor:pointer;}
  .attach .ic{font-size:18px;}
  .attach small{color:#9ca3af;display:block;font-size:10.5px;}
  .chips{padding:6px 14px 10px;display:flex;flex-direction:column;gap:8px;background:#f5f6f8;}
  .chips-t{font-size:11px;color:#86909c;}
  .chip-row{display:flex;gap:8px;flex-wrap:wrap;}
  .chip{background:#fff;border:1px solid #dbe3ee;color:#3d6fdb;font-size:13px;border-radius:18px;padding:7px 14px;cursor:pointer;transition:.15s;}
  .chip:hover{background:#eef4ff;border-color:#bcd2f7;}
  .inputbar{background:#fff;border-top:1px solid #f0f1f4;padding:10px 12px;display:flex;gap:8px;align-items:center;}
  .inputbar input{flex:1;border:none;background:#f2f3f5;border-radius:18px;padding:10px 16px;font-size:14px;outline:none;}
  .inputbar input:focus{background:#fff;box-shadow:0 0 0 2px #bfd3f5;}
  .inputbar button{width:38px;height:38px;border-radius:50%;border:none;background:#3b82f6;color:#fff;font-size:16px;cursor:pointer;flex:none;}
  .inputbar button:disabled{background:#c4c9d2;cursor:default;}
  .typing{display:inline-flex;gap:4px;padding:4px 2px;}
  .typing i{width:6px;height:6px;border-radius:50%;background:#c0c6cf;animation:blink 1.2s infinite;}
  .typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
  .demo-end{align-self:center;font-size:11.5px;color:#9ca3af;text-align:center;line-height:1.7;padding:4px 10px;}
</style>
</head>
<body>
<div class="note">模拟清小搭上架后的聊天窗样式（非官方UI）· 真实对话请用测试页 127.0.0.1:8210</div>
<div class="phone">
  <div class="statusbar">清小搭</div>
  <div class="navbar">
    <img class="avatar" src="http://127.0.0.1:8210/assets/img/xqx-logo.jpg" alt=""
         onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2238%22 height=%2238%22%3E%3Crect width=%2238%22 height=%2238%22 rx=%2210%22 fill=%22%23ffd66b%22/%3E%3Ctext x=%2219%22 y=%2225%22 text-anchor=%22middle%22 font-size=%2217%22%3E%E5%9C%86%3C/text%3E%3C/svg%3E'">
    <div>
      <div class="nb-name">清心圆桌</div>
      <div class="nb-sub">AI团体支持空间 · 发展支持</div>
    </div>
    <div class="nb-badge">上架广场</div>
  </div>
  <div class="chat" id="chat">
    <div class="row ai">
      <img class="mini-av" src="http://127.0.0.1:8210/assets/img/xqx-logo.jpg" onerror="this.style.visibility='hidden'">
      <div class="bubble">嗨～这里是清心圆桌：一位真人同学和几位AI伙伴的团体支持空间☕ 今天的圆桌有三类活动——深度团体：1️⃣减压安心之旅 2️⃣新生适应 3️⃣爱情探索 4️⃣就业迷茫；轻团体：5️⃣圆桌画室，一起画一幅画；对话面板：6️⃣时空对话，问问司马迁、项羽、张良。回复数字报名，或直接说说最近的困惑～</div>
    </div>
  </div>
  <div class="chips" id="chips">
    <div class="chips-t">大家可以这样开始聊：</div>
    <div class="chip-row">
      <button class="chip" onclick="send('我想参加减压安心之旅')">🫧 减压安心之旅</button>
      <button class="chip" onclick="send('来圆桌画室，画一幅关于最近的我的画')">🎨 圆桌画室</button>
      <button class="chip" onclick="send('我想参加时空对话')">⏳ 时空对话</button>
      <button class="chip" onclick="send('暗恋一个人两年了不敢表白，想参加爱情探索')">💞 爱情探索</button>
    </div>
  </div>
  <div class="inputbar">
    <input id="inp" placeholder="输入消息…" onkeydown="if(event.key==='Enter')go()">
    <button id="btn" onclick="go()">➤</button>
  </div>
</div>
<script>
const chat = document.getElementById('chat');
const inp = document.getElementById('inp');
const btn = document.getElementById('btn');
const AV = 'http://127.0.0.1:8210/assets/img/xqx-logo.jpg';
let busy = false;

// ---- 演示剧本（对应 PRD v0.3 新流程；真实回复走下方 API 直连，失败自动落回剧本）----
const SCRIPT = {
  '我想参加减压安心之旅': `【小晴】欢迎来到减压安心之旅～我是带领者小晴。这一场，我们想陪你把压力放一放：三位AI团友围坐一桌，把学业、科研、生活里压着你的事聊透，也练一练减压的小方法。先说好三件小事——在这里说的话留在圆桌上；不评判彼此，怎么想就怎么说；这里是同伴支持空间，不是心理治疗哦。

【小晴】今天同桌的三位团友：林之衡（大三，导师项目连轴转）、许南枝（研一，完美主义）、陈默（博三，话不多但都在听）。我们做四个活动：入桌与认识 → 四个故事的压力圆桌 → 互助讨论与减压共创 → 收获与告别。结束后你会得到一份专属《圆桌留笺》。

【小晴】先从你开始：怎么称呼你？最近哪件事让你的压力悄悄变大了？`,
  '叫我阿哲，论文一直改导师一直催': `【小晴】阿哲，改了又改、催了又催，这种一直悬着的感觉很磨人。改论文的疲惫，团友们都不陌生——

【林之衡】我懂。我上周刚经历第4版大改，师兄说"结构再调调"，我盯着文档发了十分钟呆。你改到第几版了？

【许南枝】我总是自己先不满意，改到导师催我交我才停。后来发现，我把"改"当成了躲避"交"的方式。

【小晴】阿哲，你呢——你的"一直改"里，有多少是导师真的要求，有多少是自己不敢停？`,
  '我想参加时空对话': `【小晴】欢迎来到时空对话～这里可以把问题放到千年前的智者桌上。

【小晴】照你刚才的话题，我为你请到四位：司马迁（忍辱著史的太史公）、项羽（力拔山兮的西楚霸王）、张良（运筹帷幄的谋圣）、姜尚（直钩钓鱼的太公）。合你眼缘吗？想换哪位跟我说，不换就开始。

【小晴】请提出你的问题——一个真问题就好，四位先生会依次作答，然后当着你的面辩上一轮。`,
  '怎么看待失败？我考研失败了一次': `【项羽】失败？我垓下一败，无颜见江东父老。但若问"怎么看"——我至今不肯认。你不敢跟家里说，可是怕他们失望，还是怕他们担心？

【张良】霸王恕我直言：您败的不是那一战，是听不进别人。年轻人，一次败仗不致命，致命的是从此不敢再战。

【姜尚】我在渭水钓了半辈子直钩，人人笑我。后来武王来了。失败有时只是"时候未到"——你的鱼，未必在考研这条河里。

【司马迁】我受宫刑而著《史记》。失败没有看法，只有用法：它可以压垮你，也可以成为你写下去的墨。

【小晴】四位先生说的是四种活法。想追问哪一位？还是换个问题？`,
  '_default': `【小晴】（演示模式只能走到这里啦）真实对话请打开测试页 http://127.0.0.1:8210 ，或等接入向导里的"试聊"。`
};
const PROGRESS = {
  '我想参加减压安心之旅': '📍 深度团体 · 入桌与认识｜小晴会带领转场',
  '叫我阿哲，论文一直改导师一直催': '📍 深度团体 · 四个故事的压力圆桌｜轮到你被聚焦',
  '我想参加时空对话': '⏳ 时空对话 · 四位先生已入座，等你发问',
  '怎么看待失败？我考研失败了一次': '⏳ 时空对话 · 辩论已收束，可追问/换题/结束'
};

function addUser(t){
  const r = document.createElement('div'); r.className='row user';
  r.innerHTML = '<div class="bubble"></div>';
  r.querySelector('.bubble').textContent = t;
  chat.appendChild(r); chat.scrollTop = chat.scrollHeight;
}
function aiShell(){
  const r = document.createElement('div'); r.className='row ai';
  r.innerHTML = '<img class="mini-av" src="'+AV+'" onerror="this.style.visibility=\'hidden\'"><div class="bubble"><span class="typing"><i></i><i></i><i></i></span></div>';
  chat.appendChild(r); chat.scrollTop = chat.scrollHeight;
  return r.querySelector('.bubble');
}
function finish(bubble, text, prog){
  bubble.textContent = text;
  if(prog){ const p=document.createElement('div'); p.className='progress'; p.textContent=prog; chat.appendChild(p); }
  const end=document.createElement('div'); end.className='demo-end';
  end.innerHTML='—— 示例演示 · 完整8轮请用真实服务 ——';
  chat.appendChild(end); chat.scrollTop = chat.scrollHeight;
}
function send(t){ inp.value=t; go(); }
function go(){
  const t = inp.value.trim(); if(!t||busy) return;
  busy=true; btn.disabled=true; addUser(t); inp.value='';
  const bubble = aiShell();
  // 先尝试真实API（同源限制多半会失败），失败落回演示剧本
  liveCall(t).then(txt=>{
    finish(bubble, txt, PROGRESS[t]||'');
  }).catch(()=>{
    setTimeout(()=>{ finish(bubble, SCRIPT[t]||SCRIPT['_default'], PROGRESS[t]||''); }, 900);
  }).finally(()=>{ busy=false; btn.disabled=false; });
}
async function liveCall(t){
  const key = localStorage.getItem('weilu_key') || 'sk-weilu-dev-key';
  const res = await fetch('http://127.0.0.1:8210/v1/chat/completions', {
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
    body: JSON.stringify({stream:false, messages:[{role:'user',content:t}]})
  });
  if(!res.ok) throw new Error('http '+res.status);
  const data = await res.json();
  return data.choices[0].message.content;
}
</script>
</body>
</html>
