services:
  weilu:
    build: .
    container_name: weilu-agent
    restart: unless-stopped
    ports:
      - "127.0.0.1:8200:8200"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8200/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
