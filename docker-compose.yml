services:
  weilu:
    build:
      context: .
      network: host
    container_name: weilu-agent
    restart: unless-stopped
    ports:
      # 绑定在 docker0 网关：史记的nginx容器经 172.17.0.1 反代进来，公网不可直连
      - "172.17.0.1:8200:8200"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8200/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
